[project]
name = "icg-api"
version = "1.0.0"
description = "HTTP API that generates image captions in Albanian."
readme = "README.md"
license = "MIT"
license-files = ["LICENCE"]
authors = [{ name = "Dhimitrios Duka" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "pillow>=11.0",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "torch>=2.6",
    "torchvision>=0.21",
    "uvicorn>=0.32",
]

[project.scripts]
icg-api = "icg_api.__main__:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

# Linux installs use the CPU-only PyTorch wheels, which keeps the Docker image
# small. Remove these sources to get the default CUDA-enabled wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["icg_api", "conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
